<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字迹 · 验证报告</title>
<style>body{font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif;margin:0;background:#f4f3ef;color:#272c30}main{max-width:1160px;margin:40px auto;padding:0 24px}a{color:#386b68}h1{font-size:30px}h2{font-size:20px;margin-top:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card,table{background:#fff;border:1px solid #e0e2dd;border-radius:12px}.card{padding:20px}.value{font-size:28px;font-weight:650}.label,.note{color:#66716e}.fail{color:#a34f37}.pass{color:#36755c}table{border-collapse:collapse;width:100%;overflow:hidden}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}th{color:#66716e}small{display:block}button{padding:8px 16px;border-radius:6px;border:1px solid #ccc;background:white;cursor:pointer}#pending{padding:20px;background:white;border-radius:12px}</style></head>
<body><main><a href="/">返回转换工具</a><h1>开发环境验证报告</h1><p id="build" class="note">正在读取验证记录</p><div id="pending" hidden>本轮验证仍在进行，完成后这里会显示实测结果。</div><div id="report" hidden><div class="grid" id="cards"></div><h2>需求检查</h2><table><thead><tr><th>项目</th><th>状态</th><th>证据与限制</th></tr></thead><tbody id="checks"></tbody></table><h2>诊断样本</h2><p class="note">合成回归样本用于定位算法问题，主体占比不足的输入单独保留异常标记。</p><table><thead><tr><th>样本</th><th>轮廓</th><th>特征分</th><th>节点/字</th><th>耗时</th><th>结果</th></tr></thead><tbody id="samples"></tbody></table><h2>原始记录</h2><ul id="evidence"></ul></div></main>
<script>
const add=(parent,tag,text,cls)=>{const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;parent.append(e);return e;};
fetch('/api/validation').then(r=>r.json()).then(d=>{document.querySelector('#build').textContent=d.build||'等待本轮验证';if(!d.cards){document.querySelector('#pending').hidden=false;return;}document.querySelector('#report').hidden=false;
for(const c of d.cards){const e=add(document.querySelector('#cards'),'div','','card');add(e,'div',c.label,'label');add(e,'div',c.value,'value');add(e,'small',c.note||'','note');}
for(const r of d.checks){const tr=add(document.querySelector('#checks'),'tr','');add(tr,'td',r.name);add(tr,'td',r.status,r.status==='通过'?'pass':'fail');add(tr,'td',r.detail);}
for(const r of d.samples){const tr=add(document.querySelector('#samples'),'tr','');const cell=add(tr,'td','');if(r.svg){const a=add(cell,'a',r.file);a.href=r.svg;a.target='_blank';}else cell.textContent=r.file;for(const v of [r.contour,r.feature,r.nodes,r.time,r.result])add(tr,'td',v);}
for(const r of d.evidence){const li=add(document.querySelector('#evidence'),'li','');const a=add(li,'a',r.label);a.href=r.url;a.target='_blank';}
}).catch(()=>{document.querySelector('#pending').hidden=false;document.querySelector('#pending').textContent='验证记录暂时无法读取，请刷新页面。';});
</script></body></html>
